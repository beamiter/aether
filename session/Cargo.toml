edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "2fbb5eadce38af831c7797fc40ed9995a29f2392" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "2fbb5eadce38af831c7797fc40ed9995a29f2392", features = ["linux-pty"] }
[workspace]
