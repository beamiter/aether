[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "8ac315d6314897e8166e8b0c2fc8a503575491cf" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "8ac315d6314897e8166e8b0c2fc8a503575491cf", features = ["linux-pty"] }
