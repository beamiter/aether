[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "a5a484e56d87fe75adee3fe3dc571f93087eb566" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "a5a484e56d87fe75adee3fe3dc571f93087eb566", features = ["linux-pty"] }
[workspace]
