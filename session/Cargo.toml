[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "195fdfed483b542e96f8419b80ca74a78a85a5d5" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "195fdfed483b542e96f8419b80ca74a78a85a5d5", features = ["linux-pty"] }
