[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "636d56d36dba57fb1d705ec97fc75a4c223b66f1" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "636d56d36dba57fb1d705ec97fc75a4c223b66f1", features = ["linux-pty"] }
[workspace]
