[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "f00306c79b45508747eefcc6224621b4e26cd6eb" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "f00306c79b45508747eefcc6224621b4e26cd6eb", features = ["linux-pty"] }
[workspace]
