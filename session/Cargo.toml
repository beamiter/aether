[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "9b6535dbb28701f3c17ad6804dba11cfc064aada" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "9b6535dbb28701f3c17ad6804dba11cfc064aada", features = ["linux-pty"] }
