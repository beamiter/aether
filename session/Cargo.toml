[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "25b96c478e4ddee44ccc232da78223addd2b184c" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "25b96c478e4ddee44ccc232da78223addd2b184c", features = ["linux-pty"] }
[workspace]
