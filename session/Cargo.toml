[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "b5595b03fdce538ae326f2f6e57875da70071c6e" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "b5595b03fdce538ae326f2f6e57875da70071c6e", features = ["linux-pty"] }
[workspace]
