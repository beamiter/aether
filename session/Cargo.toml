edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "466e4ea5dc1e4df12432291a11514c8402db148a" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "466e4ea5dc1e4df12432291a11514c8402db148a", features = ["linux-pty"] }
[workspace]
