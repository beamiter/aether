[package]
name = "jterm-headless-session-spike"
version = "0.0.1"
edition = "2021"
[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "d514a2ce1fb39ab58d1e2e1ab8169bbbd8817a55" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "d514a2ce1fb39ab58d1e2e1ab8169bbbd8817a55", features = ["linux-pty"] }
[workspace]
