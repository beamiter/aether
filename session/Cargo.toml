[dependencies]
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "85ccdb9c19bbfe8472c88dde83c5361b60d709e0" }
[target.'cfg(target_os = "linux")'.dependencies]
jterm_runtime = { git = "https://github.com/beamiter/jterm_core", rev = "85ccdb9c19bbfe8472c88dde83c5361b60d709e0", features = ["linux-pty"] }
