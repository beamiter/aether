name: Local desktop WebKitGTK smoke

# Keep the desktop smoke separate from ordinary application pushes.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/native-webkit.yml'
      - 'scripts/test-two-local-webkit.py'

permissions:
  contents: read

jobs:
  two-local-webkit:
    name: Two local shells in the native WebKitGTK window
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ runner.temp }}/aether-native-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Ubuntu desktop and official WebDriver packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver \
            xvfb xauth dbus-daemon fonts-dejavu-core
          dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver xvfb
      - name: Build desktop at the workflow revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.100.0 --profile minimal
          python3 scripts/check-core-pin.py
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin tauri-terminal-lab
      - name: Native window and owned local PTY acceptance (not SSH)
        timeout-minutes: 4
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          app="$CARGO_TARGET_DIR/debug/tauri-terminal-lab"
          test -x "$app"
          test ! -L "$app"
          sha256sum "$app"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24 -nolisten tcp" \
            dbus-run-session -- timeout --kill-after=25s 120s \
              /usr/bin/python3 -B scripts/test-two-local-webkit.py "$app"
