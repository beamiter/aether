name: Desktop WebKitGTK acceptance

# Keep the desktop smoke separate from ordinary application pushes.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/native-webkit.yml'
      - 'scripts/install-native-ci-dependencies.sh'
      - 'scripts/native-codex-fixture.py'
      - 'scripts/test-two-local-webkit.py'
      - 'scripts/test-remote-project-webkit.py'
      - 'scripts/test-ssh-terminal-session.py'
      - 'scripts/test-ssh-terminal-webview.py'
      - 'scripts/test-wayland-ime.py'
      - 'scripts/test-workspace-rollback.py'
      - 'scripts/test-linux-deb.py'
      - 'scripts/package-linux-deb.sh'
      - 'packaging/linux-deb.json'
      - 'bridge/Cargo.lock'
      - 'bridge/src/live.rs'
      - 'bridge/src/live/command_blocks.rs'
      - 'session/Cargo.lock'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/local_sessions.rs'
      - 'src-tauri/src/local_sessions/**'
      - 'src-tauri/src/local_block_search.rs'
      - 'src-tauri/src/local_workflows.rs'
      - 'src-tauri/src/vim9_workbench.rs'
      - 'src-tauri/src/companion.rs'
      - 'src-tauri/src/companion/**'
      - 'src-tauri/src/main.rs'
      - 'web/**'

permissions:
  contents: read

jobs:
  two-local-webkit:
    name: Local and SSH project journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Ubuntu desktop and official WebDriver packages
        timeout-minutes: 7
        run: |
          bash scripts/install-native-ci-dependencies.sh \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver \
            xvfb xauth dbus-daemon fonts-dejavu-core xdotool xclip imagemagick metacity ripgrep vim \
            openssh-client openssh-server bubblewrap sway wtype libwayland-dev \
            python3-gi gir1.2-atspi-2.0 at-spi2-core fakeroot nodejs
          sudo install -d -m 0755 /run/sshd
          dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver xvfb nodejs
      - name: Build desktop at the workflow revision
        id: build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.100.0 --profile minimal
          python3 scripts/check-core-pin.py
          export CARGO_TARGET_DIR="${RUNNER_TEMP:?}/aether-native-build"
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin tauri-terminal-lab
          cargo build --locked --manifest-path bridge/Cargo.toml --bin aether-terminal-host
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
      - name: Install the real jsh fixture
        run: |
          cargo install --locked --debug --git https://github.com/beamiter/jsh.git \
            --rev d9e18fe636d2041fc23dabd7e3d6aa1159cad2e9 \
            --root "$RUNNER_TEMP/aether-shell-fixture" jsh
          sha256sum "$RUNNER_TEMP/aether-shell-fixture/bin/jsh"
      - name: Local PTYs, Terminal Chat, Workflows, Workspace, API Chat, native task, notebook, output review and Vim9 on X11
        timeout-minutes: 5
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          app="${CARGO_TARGET_DIR:?}/debug/tauri-terminal-lab"
          test -x "$app"
          test ! -L "$app"
          sha256sum "$app"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24 -nolisten tcp" \
            dbus-run-session -- timeout --kill-after=25s 240s \
              /usr/bin/python3 -B scripts/test-two-local-webkit.py "$app" \
                --jsh "$RUNNER_TEMP/aether-shell-fixture/bin/jsh" \
                --workspace --api-chat --native-task --notebook --output-review --vim9
      - name: Real PTY Kitty graphics and Canvas pixels on X11
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24 -nolisten tcp" \
            dbus-run-session -- /usr/bin/python3 -B scripts/test-two-local-webkit.py \
              "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" --inline-graphics-only
      - name: Real PTY archived graphics, reflow and selection on X11
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24 -nolisten tcp" \
            dbus-run-session -- /usr/bin/python3 -B scripts/test-two-local-webkit.py \
              "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" --history-graphics-only
      - name: Prepare Wayland compositor clients
        id: wayland-fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          core=$(cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --filter-platform "$host" |
            python3 -c 'import json,sys; from pathlib import Path; print(next(Path(p["manifest_path"]).parents[2] for p in json.load(sys.stdin)["packages"] if p["name"] == "jterm_engine"))')
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/aether-wayland.XXXXXX")
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://archive.ubuntu.com/ubuntu/pool/universe/w/wlroots/wlroots_0.17.1.orig.tar.gz \
            --output "$fixture_dir/wlroots.tar.gz"
          printf '%s  %s\n' b4b1b08daf0728cd2648fb57660493e5b3eafe4fcc081c138de864895181cdfe \
            "$fixture_dir/wlroots.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/wlroots.tar.gz" -C "$fixture_dir" \
            wlroots-0.17.1/protocol/input-method-unstable-v2.xml \
            wlroots-0.17.1/protocol/wlr-virtual-pointer-unstable-v1.xml
          bash "$core/crates/jterm_gtk_view/tests/build-wayland-fixtures.sh" \
            "$fixture_dir/wlroots-0.17.1/protocol" "$fixture_dir/clients"
          printf 'AETHER_WAYLAND_FIXTURES=%s\n' "$fixture_dir" >> "$GITHUB_ENV"
      - name: Wayland composition, Terminal Chat and Workflows
        if: ${{ !cancelled() && steps.wayland-fixtures.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          fixture_dir="${AETHER_WAYLAND_FIXTURES:?}"
          dbus-run-session -- /usr/bin/python3 -B scripts/test-wayland-ime.py \
            "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" --output "$fixture_dir/evidence" \
            --ime-client "$fixture_dir/clients/native-ime-client" \
            --jsh "$RUNNER_TEMP/aether-shell-fixture/bin/jsh"
      - name: Vim9 composition and PTY continuity after bridge loss on Wayland
        id: wayland-vim9
        if: ${{ !cancelled() && steps.wayland-fixtures.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          fixture_dir="${AETHER_WAYLAND_FIXTURES:?}"
          dbus-run-session -- /usr/bin/python3 -B scripts/test-wayland-ime.py \
            "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" --output "$fixture_dir/vim9-evidence" \
            --ime-client "$fixture_dir/clients/native-ime-client" --vim9
      - name: Upload the Wayland Vim9 journey result
        if: ${{ !cancelled() && steps.wayland-vim9.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-wayland-vim9-result
          path: ${{ env.AETHER_WAYLAND_FIXTURES }}/vim9-evidence/result.json
          if-no-files-found: error
      - name: Native Eva feedback, split ownership and window retirement on Wayland
        id: wayland-eva
        if: ${{ !cancelled() && steps.wayland-fixtures.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          cargo install --locked --debug --git https://github.com/beamiter/jcompanion.git \
            --rev 2099481195383737633f0201bf4ce298fc4f3232 \
            --root "$RUNNER_TEMP/aether-eva-fixture" jcompaniond
          fixture_dir="${AETHER_WAYLAND_FIXTURES:?}"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24 -nolisten tcp" \
            dbus-run-session -- /usr/bin/python3 -B scripts/test-wayland-ime.py \
              "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" --output "$fixture_dir/eva-evidence" \
              --ime-client "$fixture_dir/clients/native-ime-client" \
              --jsh "$RUNNER_TEMP/aether-shell-fixture/bin/jsh" \
              --companion-daemon "$RUNNER_TEMP/aether-eva-fixture/bin/jcompaniond"
      - name: Upload the Eva journey result
        if: ${{ !cancelled() && steps.wayland-eva.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-wayland-eva-result
          path: ${{ env.AETHER_WAYLAND_FIXTURES }}/eva-evidence/result.json
          if-no-files-found: error
      - name: SSH files and read-only Workspace on X11
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1100x24 -nolisten tcp" \
            dbus-run-session -- python3 -B scripts/test-remote-project-webkit.py \
              "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" "$CARGO_TARGET_DIR/debug/aether-terminal-host" \
              --runner-ssh-config
      - name: SSH files and read-only Workspace on native Wayland
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          dbus-run-session -- python3 -B scripts/test-remote-project-webkit.py \
            "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" "$CARGO_TARGET_DIR/debug/aether-terminal-host" \
            --backend wayland --runner-ssh-config
      - name: Recover an interactive SSH terminal after relay loss
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          /usr/bin/python3 -B scripts/test-remote-project-webkit.py \
            "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" "$CARGO_TARGET_DIR/debug/aether-terminal-host" \
            --interactive-terminal --runner-ssh-config
      - name: Check out the previous Workspace host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: previous
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 9e9e630432453739c9c74931405705bacc7a7d7a
          path: rollback-base
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() && steps.previous.outcome == 'success' }}
        with:
          node-version: '24'
      - name: Rehearse Debian install, upgrade and Workspace backup rollback
        if: ${{ !cancelled() && steps.previous.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts
          stage="${RUNNER_TEMP:?}/aether-rollback"
          install -D -m 0755 "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" "$stage/candidate/desktop"
          install -D -m 0755 "$CARGO_TARGET_DIR/debug/aether-terminal-host" "$stage/candidate/host"
          cargo build --locked --manifest-path rollback-base/src-tauri/Cargo.toml --bin tauri-terminal-lab
          cargo build --locked --manifest-path rollback-base/bridge/Cargo.toml --bin aether-terminal-host
          previous=$(scripts/package-linux-deb.sh "$CARGO_TARGET_DIR/debug/tauri-terminal-lab" \
            "$CARGO_TARGET_DIR/debug/aether-terminal-host" "$stage/packages" 0.0.1-qa)
          candidate=$(scripts/package-linux-deb.sh "$stage/candidate/desktop" "$stage/candidate/host" \
            "$stage/packages" 0.0.2-qa)
          python3 -B scripts/test-linux-deb.py "$previous" "$candidate"
