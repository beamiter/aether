name: Linux contracts and build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts, PTY and WebKit smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install official Ubuntu native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev ncurses-bin vim \
            dbus-daemon xauth xvfb
      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - name: Verify core and local dependency paths
        run: python3 scripts/check-core-pin.py
      - name: Node contracts (mock DOM and IPC)
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Rust contracts and strict lint
        run: |
          for crate in session bridge src-tauri; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --check
            cargo test --locked --manifest-path "$crate/Cargo.toml"
            cargo clippy --locked --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          done
      - name: Real Vim with the default terminal profile
        run: cargo run --locked --manifest-path session/Cargo.toml --example real_vim -- /usr/bin/vim
      - name: Compile Linux desktop executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bins --examples
      - name: Smoke test the mapped Tauri window
        timeout-minutes: 3
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            timeout 55s "$CARGO_TARGET_DIR/debug/examples/native_smoke"
