[package]
name = "tauri-terminal-frame-bridge"
version = "0.0.1"
edition = "2021"
default-run = "tauri-terminal-frame-bridge"

[dependencies]
base64 = "0.22"
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "85b379f3afdf35d9b06506819428fbfe50d9f88d" }
jterm_protocol = { git = "https://github.com/beamiter/jterm_core", rev = "85b379f3afdf35d9b06506819428fbfe50d9f88d" }
getrandom = "0.4"
libc = "0.2"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

jterm-headless-session-spike = { path = "../session" }

[workspace]
