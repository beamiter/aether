[package]
name = "tauri-terminal-frame-bridge"
version = "0.0.1"
edition = "2021"
default-run = "tauri-terminal-frame-bridge"

[dependencies]
base64 = "0.22"
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "17f18bb929395d8765f32b94c15972bdf356bf82" }
jterm_protocol = { git = "https://github.com/beamiter/jterm_core", rev = "17f18bb929395d8765f32b94c15972bdf356bf82", features = ["engine-projection"] }
getrandom = "0.4"
libc = "0.2"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

jterm-headless-session-spike = { path = "../session" }

[workspace]
