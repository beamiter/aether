[package]
name = "tauri-terminal-lab"
version = "0.0.1"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-terminal-frame-bridge = { path = "../bridge" }

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"

[workspace]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
