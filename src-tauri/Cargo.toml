[package]
name = "tauri-terminal-lab"
version = "0.0.1"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
jterm_core = { git = "https://github.com/beamiter/jterm_core", rev = "c03010115766bce6f5f70bcdffc3a97545f033ae" }
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "c03010115766bce6f5f70bcdffc3a97545f033ae" }
jterm_remote_client = { git = "https://github.com/beamiter/jterm_core", rev = "c03010115766bce6f5f70bcdffc3a97545f033ae" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-terminal-frame-bridge = { path = "../bridge" }
uuid = { version = "~1.26.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
companion-host = { version = "0.1.0", git = "https://github.com/beamiter/jcompanion.git", rev = "2099481195383737633f0201bf4ce298fc4f3232" }
gdkwayland-sys = "0.18"
gdkx11 = "0.18"
gtk = "0.18"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[workspace]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
