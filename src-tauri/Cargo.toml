[package]
name = "tauri-terminal-lab"
version = "0.0.1"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
jterm_core = { git = "https://github.com/beamiter/jterm_core", rev = "afb42aaba56b7cdb256a287a3c31e9f76a734744" }
jterm_engine = { git = "https://github.com/beamiter/jterm_core", rev = "afb42aaba56b7cdb256a287a3c31e9f76a734744" }
jterm_remote_client = { git = "https://github.com/beamiter/jterm_core", rev = "afb42aaba56b7cdb256a287a3c31e9f76a734744" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-terminal-frame-bridge = { path = "../bridge" }
uuid = { version = "~1.26.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"

[workspace]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
